<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مهامي — مدير المهام</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236366f1'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f3f4fb;
    --glow1:rgba(99,102,241,.14);
    --glow2:rgba(236,72,153,.10);
    --surface:#ffffff;
    --surface-2:#f7f8fd;
    --text:#1d2033;
    --muted:#6b7280;
    --border:#e6e8f2;
    --accent:#6366f1;
    --accent-2:#8b5cf6;
    --danger:#ef4444;
    --success:#10b981;
    --shadow:0 12px 34px rgba(23,25,60,.09);
    --shadow-sm:0 4px 14px rgba(23,25,60,.06);
    --ring:rgba(99,102,241,.28);
  }
  html[data-theme="dark"]{
    --bg:#0e1020;
    --glow1:rgba(99,102,241,.16);
    --glow2:rgba(236,72,153,.08);
    --surface:#171a2c;
    --surface-2:#1d2137;
    --text:#e8eaf6;
    --muted:#9aa2b8;
    --border:#2a2f49;
    --shadow:0 14px 38px rgba(0,0,0,.42);
    --shadow-sm:0 4px 16px rgba(0,0,0,.28);
    --ring:rgba(139,92,246,.38);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{min-height:100%}
  body{
    font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
    background:
      radial-gradient(900px 420px at 85% -10%, var(--glow1), transparent 60%),
      radial-gradient(800px 380px at 5% 0%, var(--glow2), transparent 55%),
      var(--bg);
    color:var(--text);
    line-height:1.6;
    padding:28px 16px 60px;
    transition:background .3s,color .3s;
  }
  .app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 0}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 22px rgba(99,102,241,.35);
    flex:none;
  }
  .logo svg{width:26px;height:26px}
  h1{font-size:1.55rem;font-weight:800;letter-spacing:-.3px;line-height:1.2}
  .sub{color:var(--muted);font-size:.86rem;margin-top:1px}
  .icon-btn{
    width:46px;height:46px;border-radius:14px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);cursor:pointer;font-size:1.15rem;
    display:grid;place-items:center;transition:.2s;box-shadow:var(--shadow-sm);
  }
  .icon-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
  .icon-btn:active{transform:scale(.96)}

  /* ---------- Stats ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    box-shadow:var(--shadow);transition:background .3s,border-color .3s;
  }
  .stats{padding:18px 20px 16px}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:1.35rem;font-weight:800;line-height:1.2}
  .stat span{font-size:.76rem;color:var(--muted)}
  .stat.done b{color:var(--success)}
  .stat.pending b{color:var(--accent)}
  .stat.pct b{color:var(--accent-2)}
  .progress-wrap{margin-top:14px;display:flex;align-items:center;gap:12px}
  .progress{flex:1;height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
  .progress i{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .5s cubic-bezier(.22,1,.36,1);
  }
  .progress-wrap small{color:var(--muted);font-size:.78rem;white-space:nowrap}

  /* ---------- Add form ---------- */
  .add-form{padding:16px;display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center}
  .field{
    background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
    padding:11px 13px;color:var(--text);font-family:inherit;font-size:.95rem;
    outline:none;transition:.2s;min-width:0;
  }
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
  .field::placeholder{color:var(--muted)}
  select.field{cursor:pointer;padding-inline-end:10px}
  .btn-add{
    border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.98rem;
    color:#fff;padding:12px 22px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 8px 18px rgba(99,102,241,.35);
    transition:.2s;white-space:nowrap;
  }
  .btn-add:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(99,102,241,.45)}
  .btn-add:active{transform:scale(.97)}
  #taskInput{font-size:1rem;font-weight:600}

  /* ---------- Toolbar ---------- */
  .toolbar{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .toolbar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search-wrap{position:relative;flex:1;min-width:200px}
  .search-wrap .field{width:100%;padding-inline-start:38px}
  .search-wrap .search-ico{
    position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
    color:var(--muted);pointer-events:none;font-size:.95rem;
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
    padding:7px 14px;border-radius:99px;cursor:pointer;font-family:inherit;
    font-size:.85rem;font-weight:600;transition:.18s;display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.active{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(99,102,241,.3);
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
  .chip.cat.active{background:var(--surface-2);color:var(--text);border-color:currentColor}
  .chip.cat .dot{flex:none}
  .divider{height:1px;background:var(--border);margin:0 -16px}

  /* ---------- Task list ---------- */
  .list-wrap{padding:8px 10px 12px}
  #taskList{list-style:none;display:flex;flex-direction:column;gap:6px}
  .task{
    display:flex;align-items:flex-start;gap:12px;padding:12px 12px;border-radius:14px;
    border:1px solid transparent;transition:.18s;animation:slideIn .25s ease both;
  }
  .task:hover{background:var(--surface-2);border-color:var(--border)}
  @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .check{
    width:26px;height:26px;border-radius:50%;border:2px solid var(--border);
    background:transparent;cursor:pointer;flex:none;margin-top:2px;display:grid;place-items:center;
    color:#fff;font-size:.8rem;transition:.18s;
  }
  .check:hover{border-color:var(--accent)}
  .task.done .check{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
  .task-main{flex:1;min-width:0}
  .task-title{
    font-weight:600;font-size:.98rem;word-break:break-word;transition:.2s;
    cursor:text;
  }
  .task.done .task-title{text-decoration:line-through;color:var(--muted);opacity:.75}
  .task-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .tag{
    font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
    display:inline-flex;align-items:center;gap:5px;line-height:1.7;
  }
  .tag .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .tag.overdue{color:var(--danger);border-color:currentColor;background:transparent}
  .tag.today{color:var(--accent);border-color:currentColor;background:transparent}
  .actions{display:flex;gap:4px;flex:none;opacity:0;transition:.18s}
  .task:hover .actions,.task:focus-within .actions{opacity:1}
  .act{
    width:34px;height:34px;border-radius:10px;border:none;background:transparent;
    color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:.95rem;transition:.15s;
  }
  .act:hover{background:var(--surface-2);color:var(--text)}
  .act.del:hover{color:var(--danger);background:rgba(239,68,68,.1)}
  .edit-input{
    width:100%;font:inherit;font-weight:600;color:var(--text);
    background:var(--surface-2);border:1px solid var(--accent);border-radius:10px;
    padding:7px 10px;outline:none;box-shadow:0 0 0 4px var(--ring);
  }
  .empty{padding:38px 16px 46px;text-align:center;color:var(--muted)}
  .empty .big{font-size:2.4rem;margin-bottom:6px;filter:grayscale(.2)}
  .empty p{font-size:.95rem}
  .empty small{font-size:.8rem;opacity:.85}
  .clear-row{display:flex;justify-content:flex-end;padding:0 8px 6px}
  .link-btn{
    border:none;background:none;color:var(--muted);font-family:inherit;font-size:.82rem;
    cursor:pointer;padding:6px 10px;border-radius:8px;transition:.15s;font-weight:600;
  }
  .link-btn:hover{color:var(--danger);background:rgba(239,68,68,.08)}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;inset-inline:0;bottom:24px;margin-inline:auto;width:max-content;max-width:92vw;
    background:#1d2033;color:#fff;padding:11px 16px;border-radius:12px;
    box-shadow:0 14px 34px rgba(0,0,0,.3);display:flex;align-items:center;gap:14px;
    font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transform:translateY(14px);
    transition:.25s;z-index:50;
  }
  html[data-theme="dark"] .toast{background:#e8eaf6;color:#14162a}
  .toast.show{opacity:1;pointer-events:auto;transform:none}
  .toast button{
    border:none;background:rgba(255,255,255,.16);color:inherit;font-family:inherit;
    font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:8px;cursor:pointer;transition:.15s;
  }
  html[data-theme="dark"] .toast button{background:rgba(0,0,0,.1)}
  .toast button:hover{background:rgba(255,255,255,.28)}

  footer{text-align:center;color:var(--muted);font-size:.75rem;padding-top:4px;opacity:.85}
  kbd{
    background:var(--surface-2);border:1px solid var(--border);border-bottom-width:2px;
    border-radius:6px;padding:1px 6px;font-size:.7rem;font-family:inherit;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:720px){
    body{padding:18px 10px 50px}
    h1{font-size:1.3rem}
    .stats-grid{grid-template-columns:repeat(2,1fr)}
    .add-form{grid-template-columns:1fr 1fr;gap:9px}
    .add-form #taskInput{grid-column:1 / -1}
    .btn-add{grid-column:1 / -1}
    .actions{opacity:1}
    .task{padding:11px 8px}
  }
  @media (hover:none){
    .actions{opacity:1}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none"><path d="M16 33l10 10 22-23" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>مهامي</h1>
        <p class="sub">نظّم نهارك، خطوة بخطوة</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل المظهر" title="تبديل المظهر">🌙</button>
  </header>

  <section class="panel stats" aria-label="الإحصائيات">
    <div class="stats-grid">
      <div class="stat"><b id="statTotal">0</b><span>المجموع</span></div>
      <div class="stat done"><b id="statDone">0</b><span>مكتملة</span></div>
      <div class="stat pending"><b id="statPending">0</b><span>باقية</span></div>
      <div class="stat pct"><b id="statPct">0%</b><span>الإنجاز</span></div>
    </div>
    <div class="progress-wrap">
      <div class="progress"><i id="progressBar"></i></div>
      <small id="progressText">ما كاين حتى مهمة دابا</small>
    </div>
  </section>

  <form class="panel add-form" id="taskForm" autocomplete="off">
    <input class="field" id="taskInput" type="text" placeholder="شنو بغيتي تدير؟" maxlength="200" aria-label="عنوان المهمة">
    <select class="field" id="catSelect" aria-label="التصنيف">
      <option value="work">💼 عمل</option>
      <option value="personal">🏠 شخصي</option>
      <option value="study">📚 دراسة</option>
      <option value="health">💪 صحة</option>
      <option value="other">📌 أخرى</option>
    </select>
    <select class="field" id="prioSelect" aria-label="الأولوية">
      <option value="high">🔴 عالية</option>
      <option value="med" selected>🟠 متوسطة</option>
      <option value="low">🟢 منخفضة</option>
    </select>
    <input class="field" id="dateInput" type="date" aria-label="تاريخ الاستحقاق">
    <button class="btn-add" type="submit">+ زيد</button>
  </form>

  <section class="panel toolbar" aria-label="أدوات البحث والفرز">
    <div class="toolbar-row">
      <div class="search-wrap">
        <span class="search-ico">🔎</span>
        <input class="field" id="searchInput" type="search" placeholder="قلّب فالمهام…" aria-label="بحث">
      </div>
      <div class="chips" id="statusFilters">
        <button class="chip active" type="button" data-filter="all">الكل</button>
        <button class="chip" type="button" data-filter="active">مفتوحة</button>
        <button class="chip" type="button" data-filter="done">مكتملة</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="toolbar-row">
      <div class="chips" id="catFilters">
        <button class="chip cat active" type="button" data-cat="all">كل التصنيفات</button>
        <button class="chip cat" type="button" data-cat="work" style="color:#3b82f6"><span class="dot"></span>عمل</button>
        <button class="chip cat" type="button" data-cat="personal" style="color:#8b5cf6"><span class="dot"></span>شخصي</button>
        <button class="chip cat" type="button" data-cat="study" style="color:#10b981"><span class="dot"></span>دراسة</button>
        <button class="chip cat" type="button" data-cat="health" style="color:#ef4444"><span class="dot"></span>صحة</button>
        <button class="chip cat" type="button" data-cat="other" style="color:#6b7280"><span class="dot"></span>أخرى</button>
      </div>
    </div>
  </section>

  <section class="panel list-wrap" aria-label="لائحة المهام">
    <div class="clear-row" id="clearRow" hidden>
      <button class="link-btn" id="clearDoneBtn" type="button">🗑 مسح المكتملة</button>
    </div>
    <ul id="taskList"></ul>
    <div class="empty" id="emptyState">
      <div class="big">🗒️</div>
      <p>ما كاين حتى مهمة</p>
      <small>زيد أول مهمة ليك من فوق ↑</small>
    </div>
  </section>

  <footer>
    كلشي كيتسجل أوتوماتيك فالمتصفح · <kbd>/</kbd> للبحث · <kbd>Esc</kbd> للمسح
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="toastUndo" type="button">تراجع</button>
</div>

<script>
(function () {
  "use strict";

  /* ================= Config & state ================= */
  const STORAGE_KEY = "mahami.tasks.v1";
  const THEME_KEY = "mahami.theme.v1";

  const CATS = {
    work:     { label: "عمل",   color: "#3b82f6" },
    personal: { label: "شخصي",  color: "#8b5cf6" },
    study:    { label: "دراسة", color: "#10b981" },
    health:   { label: "صحة",   color: "#ef4444" },
    other:    { label: "أخرى",  color: "#6b7280" }
  };
  const PRIO = {
    high: { label: "عالية",  color: "#ef4444", rank: 0 },
    med:  { label: "متوسطة", color: "#f59e0b", rank: 1 },
    low:  { label: "منخفضة", color: "#10b981", rank: 2 }
  };

  let tasks = loadTasks();
  let statusFilter = "all";
  let catFilter = "all";
  let query = "";
  let editingId = null;
  let undoBuffer = null;
  let undoTimer = null;

  /* ================= DOM ================= */
  const $ = (id) => document.getElementById(id);
  const taskForm      = $("taskForm");
  const taskInput     = $("taskInput");
  const catSelect     = $("catSelect");
  const prioSelect    = $("prioSelect");
  const dateInput     = $("dateInput");
  const searchInput   = $("searchInput");
  const statusFilters = $("statusFilters");
  const catFilters    = $("catFilters");
  const taskList      = $("taskList");
  const emptyState    = $("emptyState");
  const clearRow      = $("clearRow");
  const clearDoneBtn  = $("clearDoneBtn");
  const themeBtn      = $("themeBtn");
  const toast         = $("toast");
  const toastMsg      = $("toastMsg");
  const toastUndo     = $("toastUndo");
  const progressBar   = $("progressBar");

  /* ================= Helpers ================= */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function esc(str) {
    return String(str).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }
  function ymd(date) {
    const d = date || new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function dueLabel(due) {
    const today = new Date(ymd() + "T00:00:00");
    const d = new Date(due + "T00:00:00");
    const days = Math.round((d - today) / 86400000);
    if (days === 0) return "اليوم";
    if (days === 1) return "غدا";
    if (days === -1) return "أمس";
    if (days > 1 && days < 7) return "بعد " + days + " أيام";
    if (days < -1 && days > -7) return "فاتو " + Math.abs(days) + " أيام";
    return d.toLocaleDateString("ar-MA", { day: "numeric", month: "short" });
  }

  /* ================= Persistence ================= */
  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr.filter((t) => t && typeof t.title === "string").map((t) => ({
        id: String(t.id || uid()),
        title: t.title,
        cat: CATS[t.cat] ? t.cat : "other",
        prio: PRIO[t.prio] ? t.prio : "med",
        due: typeof t.due === "string" && t.due ? t.due : "",
        done: !!t.done,
        created: Number(t.created) || Date.now()
      }));
    } catch (e) {
      console.warn("تعذر تحميل المهام:", e);
      return [];
    }
  }
  function saveTasks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      console.warn("تعذر حفظ المهام:", e);
    }
  }

  /* ================= Sorting & filtering ================= */
  function visibleTasks() {
    const q = query.trim().toLowerCase();
    return tasks
      .filter((t) => {
        if (statusFilter === "active" && t.done) return false;
        if (statusFilter === "done" && !t.done) return false;
        if (catFilter !== "all" && t.cat !== catFilter) return false;
        if (q && !t.title.toLowerCase().includes(q)) return false;
        return true;
      })
      .sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const pa = PRIO[a.prio].rank, pb = PRIO[b.prio].rank;
        if (pa !== pb) return pa - pb;
        const da = a.due || "9999-12-31", db = b.due || "9999-12-31";
        if (da !== db) return da < db ? -1 : 1;
        return b.created - a.created;
      });
  }

  /* ================= Rendering ================= */
  function render() {
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    const pending = total - done;
    const pct = total ? Math.round((done / total) * 100) : 0;

    $("statTotal").textContent = total;
    $("statDone").textContent = done;
    $("statPending").textContent = pending;
    $("statPct").textContent = pct + "%";
    progressBar.style.width = pct + "%";
    $("progressText").textContent = total
      ? pct + "% من المهام تكملات (" + done + "/" + total + ")"
      : "ما كاين حتى مهمة دابا";

    clearRow.hidden = done === 0;

    const list = visibleTasks();
    taskList.innerHTML = "";

    if (list.length === 0) {
      emptyState.hidden = false;
      emptyState.querySelector(".big").textContent =
        tasks.length === 0 ? "🗒️" : (statusFilter === "done" ? "✅" : "🔎");
      emptyState.querySelector("p").textContent =
        tasks.length === 0 ? "ما كاين حتى مهمة" : "ما لقيت حتى نتيجة";
      emptyState.querySelector("small").textContent =
        tasks.length === 0 ? "زيد أول مهمة ليك من فوق ↑" : "بدّل الفلتر ولا البحث";
      return;
    }
    emptyState.hidden = true;

    const today = ymd();
    const frag = document.createDocumentFragment();

    list.forEach((t) => {
      const cat = CATS[t.cat];
      const prio = PRIO[t.prio];

      const li = document.createElement("li");
      li.className = "task" + (t.done ? " done" : "");
      li.dataset.id = t.id;

      /* checkbox */
      const check = document.createElement("button");
      check.type = "button";
      check.className = "check";
      check.dataset.action = "toggle";
      check.setAttribute("aria-label", t.done ? "رجّعها مفتوحة" : "علّمها كمكتملة");
      check.innerHTML = t.done ? "✓" : "";

      /* main */
      const main = document.createElement("div");
      main.className = "task-main";

      if (editingId === t.id) {
        const input = document.createElement("input");
        input.className = "edit-input";
        input.value = t.title;
        input.maxLength = 200;
        input.dataset.id = t.id;
        main.appendChild(input);
        setTimeout(() => { input.focus(); input.select(); }, 0);
      } else {
        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = t.title;
        title.title = "دوبل كليك باش تعدّل";
        title.dataset.action = "edit";
        main.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const catTag = document.createElement("span");
        catTag.className = "tag";
        catTag.style.color = cat.color;
        catTag.innerHTML = '<span class="dot"></span>' + esc(cat.label);
        meta.appendChild(catTag);

        const prioTag = document.createElement("span");
        prioTag.className = "tag";
        prioTag.style.color = prio.color;
        prioTag.textContent = "⚑ " + prio.label;
        meta.appendChild(prioTag);

        if (t.due) {
          const dueTag = document.createElement("span");
          dueTag.className = "tag";
          const overdue = !t.done && t.due < today;
          const isToday = t.due === today;
          if (overdue) dueTag.classList.add("overdue");
          else if (isToday) dueTag.classList.add("today");
          dueTag.textContent = (overdue ? "⏰ " : "📅 ") + dueLabel(t.due);
          meta.appendChild(dueTag);
        }
        main.appendChild(meta);
      }

      /* actions */
      const actions = document.createElement("div");
      actions.className = "actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "act";
      editBtn.dataset.action = "edit";
      editBtn.title = "تعديل";
      editBtn.setAttribute("aria-label", "تعديل");
      editBtn.textContent = "✎";

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "act del";
      delBtn.dataset.action = "delete";
      delBtn.title = "حذف";
      delBtn.setAttribute("aria-label", "حذف");
      delBtn.textContent = "🗑";

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      li.appendChild(check);
      li.appendChild(main);
      li.appendChild(actions);
      frag.appendChild(li);
    });

    taskList.appendChild(frag);
  }

  /* ================= Actions ================= */
  function addTask(title) {
    tasks.push({
      id: uid(),
      title: title,
      cat: catSelect.value,
      prio: prioSelect.value,
      due: dateInput.value || "",
      done: false,
      created: Date.now()
    });
    saveTasks();
    render();
    taskInput.value = "";
    dateInput.value = "";
    taskInput.focus();
  }

  function toggleTask(id) {
    const t = tasks.find((x) => x.id === id);
    if (!t) return;
    t.done = !t.done;
    saveTasks();
    render();
  }

  function startEdit(id) {
    editingId = id;
    render();
  }

  function commitEdit(input) {
    if (!input) return;
    const id = input.dataset.id;
    const t = tasks.find((x) => x.id === id);
    if (t) {
      const val = input.value.trim();
      if (val) t.title = val;
      saveTasks();
    }
    editingId = null;
    render();
  }

  function removeTasks(selected) {
    if (!selected.length) return;
    undoBuffer = {
      items: selected
        .map((t) => ({ task: t, index: tasks.indexOf(t) }))
        .filter((x) => x.index >= 0)
        .sort((a, b) => a.index - b.index)
    };
    const ids = new Set(selected.map((t) => t.id));
    tasks = tasks.filter((t) => !ids.has(t.id));
    if (editingId && ids.has(editingId)) editingId = null;
    saveTasks();
    render();

    showToast(
      selected.length === 1 ? "تحذفات المهمة" : "تحذفو " + selected.length + " مهام",
      true
    );
  }

  function undoRemove() {
    if (!undoBuffer) return;
    undoBuffer.items.forEach((item) => {
      const at = Math.min(item.index, tasks.length);
      tasks.splice(at, 0, item.task);
    });
    undoBuffer = null;
    clearTimeout(undoTimer);
    hideToast();
    saveTasks();
    render();
  }

  function clearCompleted() {
    const done = tasks.filter((t) => t.done);
    if (done.length) removeTasks(done);
  }

  /* ================= Toast ================= */
  function showToast(msg, withUndo) {
    clearTimeout(undoTimer);
    toastMsg.textContent = msg;
    toastUndo.hidden = !withUndo;
    toast.classList.add("show");
    undoTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() {
    toast.classList.remove("show");
    if (!undoBuffer) toastUndo.hidden = true;
  }

  /* ================= Theme ================= */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
    themeBtn.title = theme === "dark" ? "المظهر الفاتح" : "المظهر الغامق";
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }
  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (!saved) {
      saved = window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    applyTheme(saved);
  }

  /* ================= Events ================= */
  taskForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = taskInput.value.trim();
    if (!title) {
      taskInput.focus();
      taskForm.classList.add("shake");
      return;
    }
    addTask(title);
  });

  statusFilters.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-filter]");
    if (!btn) return;
    statusFilter = btn.dataset.filter;
    statusFilters.querySelectorAll(".chip").forEach((c) =>
      c.classList.toggle("active", c === btn)
    );
    render();
  });

  catFilters.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cat]");
    if (!btn) return;
    catFilter = btn.dataset.cat;
    catFilters.querySelectorAll(".chip").forEach((c) =>
      c.classList.toggle("active", c === btn)
    );
    render();
  });

  searchInput.addEventListener("input", () => {
    query = searchInput.value;
    render();
  });

  taskList.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const li = target.closest(".task");
    if (!li) return;
    const id = li.dataset.id;
    const action = target.dataset.action;
    if (action === "toggle") toggleTask(id);
    else if (action === "edit") startEdit(id);
    else if (action === "delete") {
      const t = tasks.find((x) => x.id === id);
      if (t) removeTasks([t]);
    }
  });

  taskList.addEventListener("keydown", (e) => {
    if (!e.target.classList.contains("edit-input")) return;
    if (e.key === "Enter") {
      e.preventDefault();
      commitEdit(e.target);
    } else if (e.key === "Escape") {
      e.preventDefault();
      editingId = null;
      render();
    }
  });

  taskList.addEventListener("focusout", (e) => {
    if (e.target.classList && e.target.classList.contains("edit-input")) {
      commitEdit(e.target);
    }
  });

  clearDoneBtn.addEventListener("click", clearCompleted);
  toastUndo.addEventListener("click", undoRemove);
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === "Escape") {
      if (document.activeElement === searchInput && searchInput.value) {
        searchInput.value = "";
        query = "";
        render();
      }
    }
  });

  /* ================= Init ================= */
  initTheme();
  dateInput.min = ymd();
  render();
})();
</script>
</body>
</html>
